# Auto-deploy for MMS: build -> push -> run DB migrations -> roll out the new image.
# Intended for a Cloud Build trigger on pushes to main (see deploy/google-cloud/AUTO_DEPLOY.md).
# The service keeps its existing env vars and secrets; only the image changes.
substitutions:
  _REGION: asia-south1
  _REPO: vspl-mms
  _SERVICE: vspl-mms
  _MIGRATE_JOB: vspl-mms-migrate

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "deploy/google-cloud/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA"]
  # Migrations run first; if they fail the build stops and the live service is untouched.
  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        gcloud run jobs update ${_MIGRATE_JOB} --region=${_REGION} --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
        gcloud run jobs execute ${_MIGRATE_JOB} --region=${_REGION} --wait
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}", "--region=${_REGION}", "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA"]
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/app:$SHORT_SHA
